packages:
  - "playgrounds/*"
  - "client"
  - "docs"

overrides:
  "@nuxt/fonts": workspace:*
  "@nuxt/fonts>@nuxt/kit": 4.5.2
  "@nuxt/fonts>@nuxt/schema": 4.5.2
  "@nuxt/nitro-server-nightly>@nuxt/kit": npm:@nuxt/kit-nightly@5x
  "@nuxt/vite-builder-nightly>@nuxt/kit": npm:@nuxt/kit-nightly@5x
  "@types/node": ^24.13.6
  "@unocss/core": ^66.10.5
  "@unocss/nuxt": ^66.10.5
  "@unocss/preset-attributify": ^66.10.5
  "@unocss/preset-icons": ^66.10.5
  "@unocss/preset-mini": ^66.10.5
  "@unocss/reset": ^66.10.5
  nuxt-fonts-devtools>nuxt: 4.5.2
  nuxt-fonts-playground>nuxt: 4.5.2
  # ecosystem-ci injects bare first-party overrides, which would otherwise reach inside
  # the nightly subtree and mix 4.x kit/schema into the nuxt 5 playground
  nuxt-fonts-playground-nuxt5>nuxt: npm:nuxt-nightly@5x
  "nuxt-nightly>@nuxt/kit": npm:@nuxt/kit-nightly@5x
  "nuxt-nightly>@nuxt/nitro-server": npm:@nuxt/nitro-server-nightly@5x
  "nuxt-nightly>@nuxt/schema": npm:@nuxt/schema-nightly@5x
  "nuxt-nightly>@nuxt/vite-builder": npm:@nuxt/vite-builder-nightly@5x
  typescript: ^6.0.3
  unocss: ^66.10.5
  vite: ~8.3.0

patchedDependencies:
  # https://github.com/nuxt/nuxt/pull/36137 - drop when we update to nuxt v4.6.0
  "@nuxt/vite-builder@4.5.2": patches/@nuxt__vite-builder.patch

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'
  - fontaine
  - fontless
  - unifont
  - '@devframes/hub-ui@0.9.5'
  - '@devframes/hub@0.9.5'
  - '@devframes/json-render-ui@0.9.5'
  - '@devframes/json-render@0.9.5'
  - '@devframes/plugin-code-server@0.9.5'
  - '@devframes/plugin-data-inspector@0.9.5'
  - '@devframes/plugin-inspect@0.9.5'
  - '@devframes/plugin-messages@0.9.5'
  - '@devframes/plugin-terminals@0.9.5'
  - '@devframes/service-open@0.9.5'
  - '@devframes/vite@0.9.5'
  - '@vitejs/devtools-kit@0.5.2'
  - '@vitejs/devtools@0.5.2'
  - devframe@0.9.5
  - my-bad@0.2.6

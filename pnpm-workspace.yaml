packages:
  - "playgrounds/*"
  - "client"
  - "docs"

overrides:
  "@nuxt/fonts": workspace:*
  "@nuxt/fonts>@nuxt/kit": 4.5.2
  "@nuxt/fonts>@nuxt/schema": 4.5.2
  "@types/node": ^24.13.3
  "@unocss/core": ^66.8.1
  "@unocss/nuxt": ^66.8.1
  "@unocss/preset-attributify": ^66.8.1
  "@unocss/preset-icons": ^66.8.1
  "@unocss/preset-mini": ^66.8.1
  "@unocss/reset": ^66.8.1
  nuxt-fonts-devtools>nuxt: 4.5.2
  nuxt-fonts-playground>nuxt: 4.5.2
  typescript: ^6.0.3
  unocss: ^66.8.1
  vite: ~8.2.2

patchedDependencies:
  # https://github.com/nuxt/nuxt/pull/36137 - drop when we update to nuxt v4.6.0
  "@nuxt/vite-builder@4.5.2": patches/@nuxt__vite-builder.patch
  # `raw:` modules keep their source extension, so vite's css/json plugins try to
  # compile the JS they resolve to. fixed in nitro `main`; drop when it is released
  "nitro@3.0.260610-beta": patches/nitro.patch

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'
  - fontaine
  - fontless
  - unifont
  - '@devframes/hub-ui@0.9.5'
  - '@devframes/hub@0.9.5'
  - '@devframes/json-render-ui@0.9.5'
  - '@devframes/json-render@0.9.5'
  - '@devframes/plugin-code-server@0.9.5'
  - '@devframes/plugin-data-inspector@0.9.5'
  - '@devframes/plugin-inspect@0.9.5'
  - '@devframes/plugin-messages@0.9.5'
  - '@devframes/plugin-terminals@0.9.5'
  - '@devframes/service-open@0.9.5'
  - '@devframes/vite@0.9.5'
  - '@vitejs/devtools-kit@0.5.2'
  - '@vitejs/devtools@0.5.2'
  - devframe@0.9.5

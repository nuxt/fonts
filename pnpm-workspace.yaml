packages:
  - "playgrounds/*"
  - "client"
  - "docs"

overrides:
  "@nuxt/fonts": workspace:*
  # 3.4.1 was published without its .vue SFCs, so component imports fail to resolve
  "@nuxt/devtools-ui-kit": 3.4.0
  "@nuxt/kit": 4.5.2
  "@nuxt/schema": 4.5.2
  "@types/node": ^24.13.3
  "@unocss/core": ^66.8.1
  "@unocss/nuxt": ^66.8.1
  "@unocss/preset-attributify": ^66.8.1
  "@unocss/preset-icons": ^66.8.1
  "@unocss/preset-mini": ^66.8.1
  "@unocss/reset": ^66.8.1
  nuxt: 4.5.2
  typescript: ^6.0.3
  unocss: ^66.8.1
  vite: ~8.2.2

patchedDependencies:
  "@nuxt/devtools-ui-kit": patches/@nuxt__devtools-ui-kit.patch
  # https://github.com/nuxt/nuxt/pull/36137 - drop when we update to nuxt v4.6.0
  "@nuxt/vite-builder@4.5.2": patches/@nuxt__vite-builder.patch

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'
  - fontaine
  - fontless
  - unifont
  - '@devframes/hub-ui@0.9.5'
  - '@devframes/hub@0.9.5'
  - '@devframes/json-render-ui@0.9.5'
  - '@devframes/json-render@0.9.5'
  - '@devframes/plugin-code-server@0.9.5'
  - '@devframes/plugin-data-inspector@0.9.5'
  - '@devframes/plugin-inspect@0.9.5'
  - '@devframes/plugin-messages@0.9.5'
  - '@devframes/plugin-terminals@0.9.5'
  - '@devframes/service-open@0.9.5'
  - '@devframes/vite@0.9.5'
  - '@vitejs/devtools-kit@0.5.2'
  - '@vitejs/devtools@0.5.2'
  - devframe@0.9.5
